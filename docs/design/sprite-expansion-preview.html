<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildhaven sprite art preview</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#1c231d;color:#eee7d7}
body{max-width:1400px;margin:36px auto;padding:0 24px}h1{font-size:30px;margin-bottom:8px}p{max-width:850px;color:#c4cbbd}
.controls{position:sticky;top:0;background:#1c231df2;padding:12px 0;z-index:1;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit}button,select{padding:8px 12px;background:#334335;color:inherit;border:1px solid #69795b;border-radius:6px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;margin:24px 0}
article{min-width:0}h2{font-size:18px;margin:12px 0 8px}canvas,img{width:100%;height:280px;object-fit:contain;background:#637451;border-radius:8px}
a{color:#e4c888}.meta{font-size:13px;color:#bcc5b4}select{margin-bottom:8px}
</style>
<h1>Wildhaven sprite art preview</h1>
<p>Generated source art matched to the approved character reference. Animation previews use equal grid cells; final game import still needs frame alignment, scale and timing adjustments. Path pieces are overlay source art and need connector alignment before autotiling.</p>
<div class="controls"><button id="pause">Pause motion</button><label>Speed <input id="speed" type="range" min="1" max="12" value="4"> <span id="fps">4</span> fps</label><label>Backdrop <input id="bg" type="color" value="#637451"></label></div>
<main id="gallery"></main>
<script>
const assets=[{"name":"scout-idle-loop","file":"assets/characters/scout/scout-idle-loop.png","cols":4,"rows":4},{"name":"scout-chop","file":"assets/characters/scout/scout-chop.png","cols":4,"rows":1},{"name":"builder-idle-loop","file":"assets/characters/builder/builder-idle-loop.png","cols":4,"rows":4},{"name":"builder-chop","file":"assets/characters/builder/builder-chop.png","cols":4,"rows":1},{"name":"survivor-idle-loop","file":"assets/characters/survivor/survivor-idle-loop.png","cols":4,"rows":4},{"name":"survivor-chop","file":"assets/characters/survivor/survivor-chop.png","cols":4,"rows":1},{"name":"oak-wind-fall-break","file":"assets/world/source/animations/oak-wind-fall-break.png","cols":4,"rows":3},{"name":"pine-wind-fall-break","file":"assets/world/source/animations/pine-wind-fall-break.png","cols":4,"rows":3},{"name":"fire-loop","file":"assets/world/source/animations/fire-loop.png","cols":4,"rows":1},{"name":"rock-break","file":"assets/world/source/animations/rock-break.png","cols":4,"rows":1},{"name":"footprints","file":"assets/world/source/effects/footprints.png","cols":2,"rows":3},{"name":"tree-base-blends","file":"assets/world/source/effects/tree-base-blends.png","cols":3,"rows":2},{"name":"item-box-10-slots","file":"assets/ui/item-box-10-slots.png","cols":1,"rows":1},{"name":"storage-chest","file":"assets/world/source/objects/props/storage-chest.png","cols":1,"rows":1},{"name":"path-dirt","file":"assets/world/source/paths/path-dirt.png","cols":2,"rows":2},{"name":"path-cobblestone","file":"assets/world/source/paths/path-cobblestone.png","cols":2,"rows":2},{"name":"path-boardwalk","file":"assets/world/source/paths/path-boardwalk.png","cols":2,"rows":2},{"name":"path-stepping-stone","file":"assets/world/source/paths/path-stepping-stone.png","cols":2,"rows":2}];
let paused=false,elapsed=0,last=performance.now();
const gallery=document.querySelector('#gallery'), previews=[];
for(const a of assets){
 const card=document.createElement('article');const title=document.createElement('h2');title.textContent=a.name.replaceAll('-',' ');card.append(title);
 const src='../../'+a.file;const animated=a.name.includes('idle-loop')||a.name.endsWith('-chop')||a.name.includes('wind-fall-break')||['fire-loop','rock-break'].includes(a.name);
 const img=new Image();img.src=src;
 if(animated){
  const canvas=document.createElement('canvas');canvas.width=600;canvas.height=560;
  let select=null;
  if(a.rows>1){select=document.createElement('select');const options=a.rows===4?['South idle','West idle','East idle','North idle']:['Wind sway','Falling','Breaking into wood'];options.forEach((label,i)=>select.add(new Option(label,i)));card.append(select);}
  card.append(canvas);previews.push({a,img,canvas,select});
 }else{img.alt=a.name;card.append(img);}
 const meta=document.createElement('p');meta.className='meta';meta.textContent=animated?a.cols+' frames per row · '+a.rows+' row(s)':'Source sheet · '+a.cols+' columns × '+a.rows+' rows';card.append(meta);
 const link=document.createElement('a');link.href=src;link.textContent='Open full-resolution PNG';card.append(link);gallery.append(card);
}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume motion':'Pause motion';};
document.querySelector('#speed').oninput=e=>document.querySelector('#fps').textContent=e.target.value;
document.querySelector('#bg').oninput=e=>document.querySelectorAll('canvas,article img').forEach(el=>el.style.background=e.target.value);
function draw(now){
 if(!paused)elapsed+=now-last;last=now;const step=Math.floor(elapsed/1000*Number(document.querySelector('#speed').value));
 for(const {a,img,canvas,select} of previews){
  if(!img.complete||!img.naturalWidth)continue;
  const col=step%a.cols,row=select?Number(select.value):0;
  const x=Math.round(col*img.naturalWidth/a.cols),y=Math.round(row*img.naturalHeight/a.rows);
  const w=Math.round((col+1)*img.naturalWidth/a.cols)-x,h=Math.round((row+1)*img.naturalHeight/a.rows)-y;
  const scale=Math.min(canvas.width/w,canvas.height/h)*.93,ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,x,y,w,h,(canvas.width-w*scale)/2,(canvas.height-h*scale)/2,w*scale,h*scale);
 }
 requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script></html>
